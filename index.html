<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#2a1740; --noche2:#160c26; --sobre:#e9d9f5; --bolsillo:#cfb4ea; --solapa:#b896dc;
  --papel:#fffaf0; --tinta:#4a2a63; --sello:#e0446a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(ellipse at 50% 30%,var(--noche),var(--noche2));
  color:var(--papel); font-family:"Nunito",system-ui,sans-serif;
  display:grid; place-items:center; overflow-x:hidden;
}
main{width:100%;display:grid;place-items:center;padding:16px;gap:20px}

/* Sobre */
.stage{display:grid;place-items:center;gap:28px;transition:opacity .6s,transform .6s}
.stage.out{opacity:0;transform:scale(.9);pointer-events:none}
.env{position:relative;width:min(84vw,320px);aspect-ratio:3/2;perspective:900px;border:0;background:none;padding:0;cursor:pointer;margin-top:70px}
.env:focus-visible{outline:3px solid #ffd166;outline-offset:8px;border-radius:8px}
.env>*{position:absolute}
.back{inset:0;background:var(--sobre);border-radius:8px}
.paper{left:7%;right:7%;top:8%;bottom:8%;background:var(--papel);border-radius:4px;z-index:2;transition:transform .8s ease .6s}
.front{inset:0;background:var(--bolsillo);z-index:3;border-radius:8px;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.flap{left:0;right:0;top:0;height:58%;background:var(--solapa);z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease,z-index 0s .3s}
.seal{left:50%;top:41%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--sello);color:#fff;display:grid;place-items:center;font-size:18px;z-index:5;transition:opacity .3s;box-shadow:0 2px 6px #0005}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.env.open .paper{transform:translateY(-58%)}
.hint{font-size:1.05rem;opacity:.85;margin:0;text-align:center;animation:pulso 2s ease-in-out infinite}
.env.open ~ .hint{animation:none;opacity:0}
@keyframes pulso{50%{opacity:.45}}

/* Carta abierta */
.letter{display:none;background:var(--papel);color:var(--tinta);border-radius:14px;padding:28px 22px 26px;width:min(92vw,440px);text-align:center;box-shadow:0 20px 60px #0007}
.letter.show{display:block;animation:entra .7s cubic-bezier(.2,1.2,.4,1)}
@keyframes entra{from{opacity:0;transform:translateY(40px) scale(.85)}to{opacity:1;transform:none}}
h1{font-family:"Pacifico",cursive;font-weight:400;font-size:clamp(1.9rem,8vw,2.6rem);line-height:1.2;margin:0 0 8px;color:var(--sello)}
.msg{white-space:pre-line;margin:0 auto;max-width:34ch;line-height:1.6;font-size:1.05rem}
svg.ramo{width:min(70vw,260px);height:auto;display:block;margin:6px auto 4px}

.bloom{transform-box:fill-box;transform-origin:center;animation:bloom .8s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d);animation-play-state:paused}
.stem{stroke-dasharray:140;stroke-dashoffset:140;animation:crece .9s ease forwards;animation-play-state:paused}
.letter.show .bloom,.letter.show .stem{animation-play-state:running}
@keyframes bloom{from{transform:scale(0) rotate(-60deg)}to{transform:none}}
@keyframes crece{to{stroke-dashoffset:0}}
.sway{transform-origin:100px 205px;animation:mece 4s ease-in-out 2s infinite}
@keyframes mece{50%{transform:rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .stem{stroke-dashoffset:0}
}
</style>
</head>
<body>
<main>
  <div class="stage" id="stage">
    <button class="env" id="env" aria-label="Abrir la carta">
      <div class="back"></div>
      <div class="paper"></div>
      <div class="front"></div>
      <div class="flap"></div>
      <div class="seal">♥</div>
    </button>
    <p class="hint">Toca el sobre para abrirlo</p>
  </div>

  <section class="letter" id="letter" aria-live="polite">
    <h1 id="titulo">¡Feliz cumpleaños a una persona especial!</h1>
    <svg class="ramo" viewBox="0 0 200 220" role="img" aria-label="Un ramo de flores">
      <defs>
        <symbol id="f" viewBox="-20 -20 40 40">
          <g fill="currentColor">
            <ellipse cx="0" cy="-9" rx="6" ry="9"/>
            <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(60)"/>
            <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(120)"/>
            <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(180)"/>
            <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(240)"/>
            <ellipse cx="0" cy="-9" rx="6" ry="9" transform="rotate(300)"/>
          </g>
          <circle r="5" fill="#ffc83d"/>
        </symbol>
      </defs>
      <g class="sway">
        <g fill="none" stroke="#4fa36a" stroke-width="3" stroke-linecap="round">
          <path class="stem" d="M100 70 Q100 120 100 190"/>
          <path class="stem" d="M60 100 Q75 140 98 190"/>
          <path class="stem" d="M140 100 Q125 140 102 190"/>
          <path class="stem" d="M82 124 Q90 150 99 190"/>
          <path class="stem" d="M122 126 Q112 150 101 190"/>
        </g>
        <g fill="#4fa36a">
          <ellipse class="bloom" style="--d:.9s" cx="76" cy="132" rx="14" ry="6" transform="rotate(-30 76 132)"/>
          <ellipse class="bloom" style="--d:1s" cx="126" cy="134" rx="14" ry="6" transform="rotate(30 126 134)"/>
        </g>
        <!-- papel -->
        <polygon points="38,120 162,120 110,212 90,212" fill="#f7b8cf"/>
        <polygon points="38,120 100,120 90,212" fill="#fbd3e2"/>
        <path d="M70 160 Q100 172 130 160 L126 176 Q100 188 74 176 Z" fill="#e0446a"/>
        <!-- flores -->
        <g class="bloom" style="--d:.5s"><use href="#f" x="74" y="22" width="52" height="52" style="color:#ff6b81"/></g>
        <g class="bloom" style="--d:.7s"><use href="#f" x="36" y="58" width="46" height="46" style="color:#ffd166"/></g>
        <g class="bloom" style="--d:.8s"><use href="#f" x="118" y="58" width="46" height="46" style="color:#b69cff"/></g>
        <g class="bloom" style="--d:1s"><use href="#f" x="62" y="84" width="40" height="40" style="color:#ff9eb5"/></g>
        <g class="bloom" style="--d:1.1s"><use href="#f" x="102" y="86" width="40" height="40" style="color:#ffb35c"/></g>
        <g class="bloom" style="--d:1.2s"><use href="#f" x="80" y="62" width="40" height="40" style="color:#f4efe6"/></g>
      </g>
    </svg>
    <p class="msg" id="mensaje">Espero que tus sueños se hagan realidad.</p>
  </section>
</main>

<script>
  // Personaliza aquí:
  var TITULO = "¡Feliz cumpleaños a una persona especial!";
  var MENSAJE = "Espero que tus sueños se hagan realidad.\n\nSigue esforzándote, alguien siempre estará orgullosa de ti.\n\nSi llegaste hasta aquí, me debes un Kirby ♥";

  document.getElementById("titulo").textContent = TITULO;
  document.getElementById("mensaje").textContent = MENSAJE;

  var env = document.getElementById("env");
  var abierto = false;
  env.addEventListener("click", function () {
    if (abierto) return;
    abierto = true;
    env.classList.add("open");
    setTimeout(function () { document.getElementById("stage").classList.add("out"); }, 1900);
    setTimeout(function () {
      document.getElementById("stage").style.display = "none";
      document.getElementById("letter").classList.add("show");
    }, 2500);
  });
</script>
</body>
</html>
